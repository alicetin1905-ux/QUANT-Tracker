name: QNT price alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

concurrency:
  group: price-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore last run's state
        uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check prices and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 alerts/check.py ${{ inputs.test && '--test' || '' }}

      - name: Save state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: alert-state-${{ github.run_id }}
